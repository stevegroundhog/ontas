# One-click on Render.com — free web service
# Button: https://render.com/deploy?repo=https://github.com/stevegroundhog/ontas
services:
  - type: web
    name: ontas
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:node
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: "production"
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "10000"
      - key: NITRO_HOST
        value: "0.0.0.0"
      - key: NITRO_PORT
        value: "10000"
      - key: NITRO_PRESET
        value: "node-server"
